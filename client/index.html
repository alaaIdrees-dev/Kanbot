<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f16" />
    <meta name="description" content="Kanbot — your sprint board with an AI teammate." />
    <link rel="icon" type="image/svg+xml" href="./src/assets/kanbot-icon.svg" />
    <title>Kanbot</title>
    <!-- Set the colour scheme before first paint (no light flash). Dark is the default; the key is MUI's mode storage. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("mui-mode") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

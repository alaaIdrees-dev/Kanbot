<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f16" />
    <meta name="description" content="Kanbot — your sprint board with an AI teammate." />
    <link rel="icon" type="image/svg+xml" href="./src/assets/kanbot-icon.svg" />
    <title>Kanbot</title>
    <!-- Set the colour scheme before first paint (no flash). Stored choice (MUI's "mui-mode": light | dark | system) wins; with no choice (or "system") the OS preference decides. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var mode = localStorage.getItem("mui-mode");
          if (mode === "light" || mode === "dark") theme = mode;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
            theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
